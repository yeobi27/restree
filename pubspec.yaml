name: restree
description: "RESTREE : 하루를 닫는 기록 — 매일의 기록으로 나무를 키우는 감성 일기 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리 — 설계서 2.3 권장 도구
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.2.0

  # Firebase (BaaS) — 설계서 4장
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  cloud_functions: ^5.0.6
  firebase_messaging: ^15.0.4

  # 소셜 로그인 — 카카오 / Google / Apple
  kakao_flutter_sdk_user: ^1.9.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # 애니메이션 — 설계서 2.3 (나뭇잎 생성, 나무 성장, 암전 연출)
  rive: ^0.13.13

  # 감정 정원 통계 그래프
  fl_chart: ^0.68.0

  # 사진 첨부 — 보완설계서 3장 imageUrl
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # 로컬 캐시(오프라인 지원) — 설계서 2.3
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  # TODO: 디자인 시스템 확정 후 폰트(세리프 계열) 및 에셋 경로 등록
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.ttf
  # assets:
  #   - assets/animations/   (Rive 파일: 나뭇잎 생성, 나무 성장, 암전 연출)
  #   - assets/images/
